name: Build Gentleman Menu iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS Simulator App
        run: |
          xcodebuild \
            -project GentlemanMenu.xcodeproj \
            -scheme GentlemanMenu \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package App
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r GentlemanMenu-iOS-Simulator.zip GentlemanMenu.app

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: GentlemanMenu-iOS-Simulator
          path: build/Build/Products/Release-iphonesimulator/GentlemanMenu-iOS-Simulator.zip
